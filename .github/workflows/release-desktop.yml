name: Build Desktop EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.14.0)'
        required: false
        default: 'v0.14.0'

jobs:
  build:
    name: Compile WinUI 3 EXE
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      DOTNET_ROLL_FORWARD: LatestMajor

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install .NET 8.0 SDK (exact)
        shell: pwsh
        run: |
          # Install specific .NET 8 SDK
          Invoke-WebRequest -Uri "https://dot.net/v1/dotnet-install.ps1" -OutFile dotnet-install.ps1
          .\dotnet-install.ps1 -Channel 8.0 -InstallDir "$env:LOCALAPPDATA\Microsoft\dotnet"
          $env:Path = "$env:LOCALAPPDATA\Microsoft\dotnet;$env:Path"
          dotnet --version
          dotnet --list-sdks
          # Pin to .NET 8 via global.json
          @{
            sdk = @{
              version = "8.0.423"
              rollForward = "latestFeature"
            }
          } | ConvertTo-Json | Set-Content -Path global.json
          echo "DOTNET_ROOT=$env:LOCALAPPDATA\Microsoft\dotnet" >> $env:GITHUB_ENV
          echo "$env:LOCALAPPDATA\Microsoft\dotnet" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Verify .NET 8
        shell: pwsh
        run: |
          dotnet --version
          dotnet --list-sdks
          dotnet --list-runtimes

      - name: Install Windows App SDK workload
        shell: pwsh
        run: |
          dotnet workload install windows-desktop --skip-sign-check
          dotnet workload list

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:EnableMsixTooling=false -p:AppxPackage=false -o publish-output

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (Test-Path "publish-output\LizCoderPlus.Desktop.exe") {
            $size = [math]::Round((Get-Item "publish-output\LizCoderPlus.Desktop.exe").Length / 1MB, 2)
            Write-Host "EXE found: $size MB"
            Compress-Archive -Path publish-output\* -DestinationPath LizCoderPlus-win-x64.zip -Force
          } else {
            Write-Host "ERROR: EXE not found"
            Get-ChildItem publish-output -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: LizCoderPlus-win-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.version || 'v0.14.0' }}"
          gh release create $tag LizCoderPlus-win-x64.zip --title "Liz Coder Plus $tag" --notes "Build automatico desde GitHub Actions" --prerelease

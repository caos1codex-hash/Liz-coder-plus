name: Build Desktop EXE

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.14.0)'
        required: false
        default: 'v0.14.0'

jobs:
  build:
    name: Compile WinUI 3 EXE
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Windows Desktop workload
        shell: pwsh
        run: |
          Write-Host "=== .NET SDK ==="
          dotnet --version
          dotnet --list-sdks

          Write-Host "=== Installing workload ==="
          dotnet workload install windows-desktop --skip-sign-check

          Write-Host "=== Workloads ==="
          dotnet workload list

          Write-Host "=== Checking for ExpandPriContent DLL ==="
          $sdkDir = & dotnet --list-sdks | Select-Object -First 1 | ForEach-Object {
            ($_ -split '\[')[0].Trim() -replace '^\s+',''
          }
          Write-Host "SDK Dir: $sdkDir"
          $priPath = Join-Path $sdkDir "Microsoft\VisualStudio\v17.0\AppxPackage\Microsoft.Build.Packaging.Pri.Tasks.dll"
          Write-Host "PRI DLL path: $priPath"
          Write-Host "Exists: $(Test-Path $priPath)"
          if (Test-Path $priPath) {
            Get-Item $priPath | Select-Object FullName, Length
          } else {
            Write-Host "Searching for ExpandPriContent..."
            Get-ChildItem -Path "C:\Program Files\dotnet" -Recurse -Filter "Microsoft.Build.Packaging.Pri.Tasks.dll" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
            Get-ChildItem -Path "C:\Program Files\Microsoft Visual Studio" -Recurse -Filter "Microsoft.Build.Packaging.Pri.Tasks.dll" -ErrorAction SilentlyContinue | Select-Object -First 3 FullName
          }

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Build Release
        shell: pwsh
        run: |
          dotnet build apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Publish EXE
        shell: pwsh
        run: |
          dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:EnableMsixTooling=false -p:AppxPackage=false -o publish-output

      - name: Verify EXE exists
        shell: pwsh
        run: |
          if (Test-Path "publish-output\LizCoderPlus.Desktop.exe") {
            $size = [math]::Round((Get-Item "publish-output\LizCoderPlus.Desktop.exe").Length / 1MB, 2)
            Write-Host "SUCCESS: EXE found ($size MB)"
            Compress-Archive -Path publish-output\* -DestinationPath LizCoderPlus-win-x64.zip -Force
          } else {
            Write-Host "ERROR: EXE not found"
            Get-ChildItem publish-output -ErrorAction SilentlyContinue
            exit 1
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: LizCoderPlus-win-x64.zip
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.version || 'v0.14.0' }}"
          gh release create $tag LizCoderPlus-win-x64.zip --title "Liz Coder Plus $tag" --notes "Build automatico desde GitHub Actions" --prerelease

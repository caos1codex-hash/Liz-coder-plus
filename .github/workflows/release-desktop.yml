name: Build Desktop EXE + Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.18.0)'
        required: false
        default: 'v0.18.0'

jobs:
  build:
    name: Compile WinUI 3 + Inno Setup Installer
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch MSBuild extensions from VS2022
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Write-Host "VS2022 Path: $vsPath"

          $sdkVersion = dotnet --version
          Write-Host "SDK Version: $sdkVersion"

          $srcBase = "$vsPath\MSBuild\Microsoft\VisualStudio\v17.0"
          $sdkBase = "C:\Program Files\dotnet\sdk\$sdkVersion\Microsoft\VisualStudio\v17.0"
          New-Item -ItemType Directory -Path $sdkBase -Force | Out-Null

          if (Test-Path "$srcBase\AppxPackage") {
            Copy-Item "$srcBase\AppxPackage" -Destination "$sdkBase\AppxPackage" -Recurse -Force
            Write-Host "Copied AppxPackage OK"
          } else {
            Write-Host "WARNING: AppxPackage not found in VS2022"
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Build Release
        shell: pwsh
        run: dotnet build apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Publish EXE
        shell: pwsh
        run: dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:EnableMsixTooling=false -p:AppxPackage=false -o publish-output

      - name: Verify EXE and list files
        shell: pwsh
        run: |
          Write-Host "=== Contents of publish-output ==="
          Get-ChildItem publish-output -File | Select-Object Name, @{N='SizeMB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

          # WinUI 3 with OutputType=WinExe publishes as .exe
          $exe = Get-ChildItem publish-output -Filter "*.exe" | Select-Object -First 1
          if ($exe) {
            $size = [math]::Round($exe.Length / 1MB, 2)
            Write-Host "SUCCESS: $($exe.Name) ($size MB)"
          } else {
            # Maybe it published as .dll with a .exe wrapper
            $dll = Get-ChildItem publish-output -Filter "LizCoderPlus*" | Select-Object -First 1
            if ($dll) {
              Write-Host "Found: $($dll.Name) ($([math]::Round($dll.Length/1MB,2)) MB)"
              Write-Host "Total files: $((Get-ChildItem publish-output -File).Count)"
            } else {
              Write-Host "ERROR: No LizCoderPlus files found"
              exit 1
            }
          }

          $fileCount = (Get-ChildItem publish-output -File).Count
          Write-Host "Total files in publish-output: $fileCount"

      # =============================================
      # STEP: Build Inno Setup Installer (.exe)
      # =============================================
      - name: Install Inno Setup
        shell: pwsh
        run: |
          # Inno Setup 6 is usually pre-installed on windows-2022
          $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (Test-Path $innoPath) {
            Write-Host "Inno Setup already installed: $innoPath"
          } else {
            Write-Host "Installing Inno Setup via Chocolatey..."
            choco install innosetup -y --no-progress
            $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $innoPath)) {
              Write-Host "ERROR: Inno Setup not found after install"
              exit 1
            }
          }
          Write-Host "Inno Setup ready: $innoPath"

      - name: Generate app icon for installer
        shell: pwsh
        run: |
          # Create a simple .ico file if none exists
          $icoPath = "apps\desktop\assets\app.ico"
          if (-not (Test-Path $icoPath)) {
            Write-Host "No icon found, creating a placeholder..."
            # Use PowerShell to create a minimal valid ICO (16x16 blue square)
            Add-Type -AssemblyName System.Drawing
            $bmp = New-Object System.Drawing.Bitmap(32, 32)
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.Clear([System.Drawing.Color]::FromArgb(66, 133, 244))  # Google Blue
            $font = New-Object System.Drawing.Font("Arial", 18, [System.Drawing.FontStyle]::Bold)
            $g.DrawString("L", $font, [System.Drawing.Brushes]::White, 4, 2)
            $g.Dispose()
            $icoPathDir = Split-Path $icoPath -Parent
            if (-not (Test-Path $icoPathDir)) { New-Item -ItemType Directory -Path $icoPathDir -Force | Out-Null }
            $stream = [System.IO.File]::Create($icoPath)
            $bmp.Save($stream, [System.Drawing.Imaging.ImageFormat]::Icon)
            $stream.Close()
            $bmp.Dispose()
            Write-Host "Icon created: $icoPath"
          } else {
            Write-Host "Icon found: $icoPath"
          }

      - name: Build Installer EXE
        shell: pwsh
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          $scriptPath = "apps\desktop\installer.iss"
          Write-Host "Compiling installer..."
          & $innoPath $scriptPath /Q
          if (Test-Path "apps\desktop\installer-output\LizCoderPlus-Setup-*.exe") {
            $installer = Get-Item "apps\desktop\installer-output\LizCoderPlus-Setup-*.exe" | Select-Object -First 1
            $sizeMB = [math]::Round($installer.Length / 1MB, 2)
            Write-Host "SUCCESS: Installer EXE ($sizeMB MB): $($installer.FullName)"
            Copy-Item $installer.FullName "LizCoderPlus-Setup.exe" -Force
          } else {
            Write-Host "Looking in alternative paths..."
            Get-ChildItem "apps\desktop" -Filter "*.exe" -Recurse -ErrorAction SilentlyContinue
            Get-ChildItem "." -Filter "LizCoderPlus-Setup*" -ErrorAction SilentlyContinue
            Write-Host "ERROR: Installer EXE not found"
            exit 1
          }

      # =============================================
      # STEP: Upload both artifacts
      # =============================================
      - name: Upload Installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-Installer
          path: LizCoderPlus-Setup.exe
          retention-days: 30

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: publish-output/
          retention-days: 30

      # =============================================
      # STEP: Create GitHub Release with both files
      # =============================================
      - name: Create GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.version || 'v0.18.0' }}"

          # Delete existing release if it exists
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Deleting existing release $tag"
            gh release delete $tag --yes
          }

          # Create ZIP for the raw files
          Compress-Archive -Path publish-output\* -DestinationPath LizCoderPlus-win-x64.zip -Force

          # Create release with both files
          gh release create $tag `
            LizCoderPlus-Setup.exe `
            LizCoderPlus-win-x64.zip `
            --title "Liz Coder Plus $tag" `
            --notes "Instalador profesional (.exe) y version portable (.zip). Ejecuta LizCoderPlus-Setup.exe para instalar como aplicacion de Windows." `
            --prerelease

          Write-Host "Release $tag created successfully"

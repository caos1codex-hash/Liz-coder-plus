# ============================================================
# GitHub Actions: Build & Release WinUI 3 Desktop .exe
# ============================================================

name: Build Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '0.14.0'

jobs:
  build-windows:
    name: Build Windows Desktop .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin to .NET 8 SDK
        shell: pwsh
        run: |
          $globalJson = '{"sdk":{"version":"8.0.423","rollForward":"latestFeature"}}'
          $globalJson | Out-File -FilePath global.json -Encoding utf8
          dotnet --version

      - name: Install workloads
        shell: pwsh
        run: dotnet workload install windows-desktop

      - name: Restore
        shell: pwsh
        run: dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Publish
        shell: pwsh
        run: dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:AppxPackage=false

      - name: Find .exe and create ZIP
        shell: pwsh
        run: |
          $publishDir = "apps\desktop\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\publish"
          $exe = Get-ChildItem -Path $publishDir -Filter "LizCoderPlus*.exe" | Select-Object -First 1
          if ($exe) {
            $size = [math]::Round($exe.Length / 1MB, 2)
            echo "EXE FOUND: $($exe.Name) ($size MB)"
            Compress-Archive -Path "$publishDir\*" -DestinationPath "LizCoderPlus-0.14.0-win-x64.zip" -Force
          } else {
            echo "ERROR: No .exe"
            exit 1
          }

      - name: Upload ZIP
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: LizCoderPlus-0.14.0-win-x64.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: dist/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.14.0 dist/*.zip \
            --repo ${{ github.repository }} \
            --title "Liz Coder Plus v0.14.0" \
            --notes "Liz Coder Plus v0.14.0 - Windows x64" 2>&1 || true
          echo "Done!"

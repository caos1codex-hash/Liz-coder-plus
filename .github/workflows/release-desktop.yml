# Combined debug + release workflow
name: Build Desktop Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '0.14.0'
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  build:
    name: Build and Package
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin to .NET 8 SDK
        shell: pwsh
        run: |
          $globalJson = '{"sdk":{"version":"8.0.423","rollForward":"latestFeature"}}'
          $globalJson | Out-File -FilePath $env:GITHUB_WORKSPACE\global.json -Encoding utf8
          dotnet --version 2>&1 | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Encoding utf8

      - name: Install workloads
        shell: pwsh
        run: |
          "=== Workloads ===" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
          dotnet workload install windows-desktop 2>&1 | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8

      - name: Restore
        shell: pwsh
        run: |
          "=== Restore ===" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
          dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64 2>&1 | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8

      - name: Build
        shell: pwsh
        run: |
          "=== Build ===" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
          dotnet build apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 2>&1 | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8

      - name: Publish
        shell: pwsh
        continue-on-error: true
        run: |
          "=== Publish ===" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
          dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:AppxPackage=false -o publish-output 2>&1 | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8

      - name: Create ZIP
        shell: pwsh
        run: |
          "=== Output Files ===" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
          Get-ChildItem publish-output -ErrorAction SilentlyContinue | ForEach-Object { "$($_.Name) $($_.Length)" } | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8

          if (Test-Path "publish-output\LizCoderPlus.Desktop.exe") {
            $exeSize = [math]::Round((Get-Item "publish-output\LizCoderPlus.Desktop.exe").Length / 1MB, 2)
            "EXE FOUND: $exeSize MB" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
            Compress-Archive -Path publish-output\* -DestinationPath release.zip -Force
            $zipSize = [math]::Round((Get-Item release.zip).Length / 1MB, 2)
            "ZIP CREATED: $zipSize MB" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
          } else {
            "ERROR: exe not found" | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
            Get-ChildItem -Recurse apps/desktop\bin -Filter "*.exe" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } | Out-File -FilePath $env:GITHUB_WORKSPACE\build-output.txt -Append -Encoding utf8
          }

      - name: Upload ZIP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: release.zip
          retention-days: 30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-output.txt
          retention-days: 7

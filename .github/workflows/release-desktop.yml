name: Build Desktop Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.18.0)'
        required: false
        default: 'v0.18.0'

jobs:
  build:
    name: Build WinUI 3 + Installer EXE
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch MSBuild from VS2022
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $sdkVersion = dotnet --version
          $src = "$vsPath\MSBuild\Microsoft\VisualStudio\v17.0\AppxPackage"
          $dst = "C:\Program Files\dotnet\sdk\$sdkVersion\Microsoft\VisualStudio\v17.0\AppxPackage"
          if (Test-Path $src) {
            New-Item -ItemType Directory -Path (Split-Path $dst -Parent) -Force | Out-Null
            Copy-Item $src -Destination $dst -Recurse -Force
            Write-Host "AppxPackage copied OK"
          } else {
            Write-Host "WARNING: $src not found"
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Build
        shell: pwsh
        run: dotnet build apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Publish
        shell: pwsh
        run: dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:EnableMsixTooling=false -p:AppxPackage=false -o publish-output

      - name: Verify publish
        shell: pwsh
        run: |
          Write-Host "=== Top 15 files by size ==="
          Get-ChildItem publish-output -File | Sort-Object Length -Descending | Select-Object -First 15 Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          $total = (Get-ChildItem publish-output -File | Measure-Object -Property Length -Sum).Sum
          Write-Host "Total: $((Get-ChildItem publish-output -File).Count) files, $([math]::Round($total/1MB)) MB"

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            Write-Host "Inno Setup not found, installing..."
            choco install innosetup -y --no-progress
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          Write-Host "ISCC: $iscc"

          # Copy the .iss template AS-IS (no modifications needed)
          # The template already references LizCoderPlus.Desktop.exe
          Copy-Item "apps\desktop\installer-ci.iss" "installer-build.iss" -Force

          Write-Host "=== installer-build.iss contents ==="
          Get-Content "installer-build.iss" | ForEach-Object { $i = 0 } { $i++; "$i : $_" }

          # Compile the installer
          & $iscc "installer-build.iss"
          $exitCode = $LASTEXITCODE
          Write-Host "ISCC exit code: $exitCode"

          if ($exitCode -ne 0) {
            Write-Host "ERROR: Inno Setup compilation failed"
            exit 1
          }

          # Find output
          $setup = Get-Item "installer-output\LizCoderPlus-Setup-*.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($setup) {
            Copy-Item $setup.FullName "LizCoderPlus-Setup.exe" -Force
            Write-Host "SUCCESS: LizCoderPlus-Setup.exe ($([math]::Round($setup.Length/1MB, 2)) MB)"
          } else {
            Write-Host "ERROR: Setup EXE not found in installer-output"
            exit 1
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-Installer
          path: LizCoderPlus-Setup.exe
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.version || 'v0.18.0' }}"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes }
          gh release create $tag LizCoderPlus-Setup.exe --title "Liz Coder Plus $tag" --notes "Instalador profesional para Windows. Descarga LizCoderPlus-Setup.exe, haz doble click y sigue las instrucciones." --prerelease
          Write-Host "Release $tag created"

# ============================================================
# GitHub Actions: Build & Release WinUI 3 Desktop .exe
# Triggers on version tag push (v*.*.*)
# Uses global.json to pin .NET 8 SDK
# ============================================================

name: Build Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.14.0)'
        required: true
        default: '0.14.0'

jobs:
  build-windows:
    name: Build Windows Desktop .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.423'

      - name: Verify .NET version
        shell: pwsh
        run: dotnet --version

      - name: Install Windows Desktop workload
        shell: pwsh
        run: dotnet workload install windows-desktop

      - name: Restore
        shell: pwsh
        run: dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishSingleFile=false `
            -p:AppxPackage=false

      - name: Find .exe and create ZIP
        shell: pwsh
        run: |
          $publishDir = "apps\desktop\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\publish"
          if (Test-Path $publishDir) {
            $exe = Get-ChildItem -Path $publishDir -Filter "LizCoderPlus*.exe" | Select-Object -First 1
            if ($exe) {
              $size = [math]::Round($exe.Length / 1MB, 2)
              echo "EXE FOUND: $($exe.Name) ($size MB)"
              Compress-Archive -Path "$publishDir\*" -DestinationPath "LizCoderPlus-0.14.0-win-x64.zip" -Force
              $zipSize = [math]::Round((Get-Item "LizCoderPlus-0.14.0-win-x64.zip").Length / 1MB, 2)
              echo "ZIP CREATED: $zipSize MB"
            } else {
              echo "ERROR: No .exe in $publishDir"
              Get-ChildItem $publishDir | Select Name
              exit 1
            }
          } else {
            echo "ERROR: Publish dir not found: $publishDir"
            Get-ChildItem "apps\desktop\bin" -Recurse -Filter "*.exe" -ErrorAction SilentlyContinue | Select FullName
            exit 1
          }

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: LizCoderPlus-0.14.0-win-x64.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v0.14.0 \
            dist/*.zip \
            --repo ${{ github.repository }} \
            --title "Liz Coder Plus v0.14.0" \
            --notes "## Liz Coder Plus v0.14.0

          ### Descarga
          - **Windows x64**: LizCoderPlus-0.14.0-win-x64.zip

          ### Instalacion
          1. Descarga el ZIP
          2. Extrae el contenido
          3. Ejecuta LizCoderPlus.Desktop.exe" \
            --generate-notes 2>&1 || true

          echo "Release created!"

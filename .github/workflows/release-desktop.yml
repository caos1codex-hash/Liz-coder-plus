# ============================================================
# GitHub Actions Workflow: Build & Release Desktop .exe
# Triggers on version tag push (v*.*.*)
# Builds WinUI 3 app on windows-latest, creates Release
# ============================================================

name: Build Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.14.0)'
        required: true
        default: '0.14.0'
      prerelease:
        description: 'Mark as prerelease'
        required: false
        type: boolean
        default: false

env:
  DOTNET_VERSION: '8.0.x'
  PROJECT_DIR: apps/desktop
  CONFIGURATION: Release

jobs:
  build-windows:
    name: Build Windows Desktop .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
            $ver = "${{ github.event.inputs.version }}"
          } else {
            $ver = "${{ github.ref_name }}".TrimStart('v')
          }
          echo "VERSION=$ver" >> $env:GITHUB_OUTPUT
          echo "Building version: $ver"

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Windows App SDK workloads
        shell: pwsh
        run: |
          dotnet workload install windows-desktop
          dotnet workload install windows-desktop-mvvm
          echo "Workloads installed:"
          dotnet workload list

      - name: Restore NuGet packages
        shell: pwsh
        run: |
          dotnet restore ${{ env.PROJECT_DIR }}/LizCoderPlus.Desktop.csproj `
            -r win-x64 `
            -p:Platform=x64

      - name: Build win-x64 self-contained single-file
        shell: pwsh
        run: |
          dotnet publish ${{ env.PROJECT_DIR }}/LizCoderPlus.Desktop.csproj `
            -c ${{ env.CONFIGURATION }} `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:PublishTrimmed=false `
            -p:EnableCompressionInSingleFile=true `
            -p:Version=${{ steps.version.outputs.VERSION }} `
            -p:ApplicationVersion=${{ steps.version.outputs.VERSION }} `
            -o dist/LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64

      - name: Verify output
        shell: pwsh
        run: |
          $exePath = "dist\LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64\LizCoderPlus.Desktop.exe"
          if (Test-Path $exePath) {
            $size = [math]::Round((Get-Item $exePath).Length / 1MB, 2)
            echo "SUCCESS: $exePath ($size MB)"
          } else {
            echo "WARNING: Expected .exe not found. Listing output:"
            Get-ChildItem -Recurse dist\ | Select-Object FullName
          }

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path dist/LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64/* `
            -DestinationPath dist/LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64.zip -Force
          $size = [math]::Round((Get-Item "dist\LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64.zip").Length / 1MB, 2)
          echo "Created ZIP: $size MB"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64
          path: dist/LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64.zip
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "VERSION=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "VERSION=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LizCoderPlus-${{ steps.version.outputs.VERSION }}-win-x64
          path: dist/

      - name: List files
        run: ls -lh dist/

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          TAG="v${VERSION}"

          NOTES="## Liz Coder Plus v${VERSION}

          ### Download
          - **Windows x64**: \`LizCoderPlus-${VERSION}-win-x64.zip\`

          ### Instalacion
          1. Descarga el ZIP
          2. Extrae el contenido
          3. Ejecuta \`LizCoderPlus.Desktop.exe\`

          ---
          Generado por GitHub Actions."

          if gh release view "$TAG" --repo ${{ github.repository }} 2>/dev/null; then
            echo "Release exists, uploading assets..."
            gh release upload "$TAG" dist/*.zip --repo ${{ github.repository }} --clobber
          else
            echo "Creating release $TAG..."
            gh release create "$TAG" \
              dist/*.zip \
              --repo ${{ github.repository }} \
              --title "Liz Coder Plus v${VERSION}" \
              --notes "$NOTES"
          fi

          echo "Release $TAG done!"

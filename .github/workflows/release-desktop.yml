# ============================================================
# GitHub Actions: Build WinUI 3 Desktop .exe
# ============================================================

name: Build Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version'
        required: true
        default: '0.14.0'

jobs:
  build:
    name: Build Windows Desktop .exe
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Pin to .NET 8
        shell: pwsh
        run: |
          '{"sdk":{"version":"8.0.423","rollForward":"latestFeature"}}' | Out-File global.json -Encoding utf8
          dotnet --version

      - name: Install workloads
        shell: pwsh
        run: dotnet workload install windows-desktop

      - name: Build and Publish
        shell: pwsh
        run: |
          dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64
          dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:AppxPackage=false -o publish-output

      - name: Create ZIP
        shell: pwsh
        run: |
          if (Test-Path "publish-output\LizCoderPlus.Desktop.exe") {
            $size = [math]::Round((Get-Item "publish-output\LizCoderPlus.Desktop.exe").Length / 1MB, 2)
            echo "EXE: $size MB"
            Compress-Archive -Path publish-output\* -DestinationPath release.zip -Force
            echo "ZIP: $([math]::Round((Get-Item release.zip).Length/1MB,2)) MB"
          } else {
            echo "ERROR: exe not found"
            Get-ChildItem publish-output -ErrorAction SilentlyContinue | Select Name
            exit 1
          }

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: release.zip
          retention-days: 30

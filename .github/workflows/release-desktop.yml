name: Build Desktop EXE + Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.18.0)'
        required: false
        default: 'v0.18.0'

jobs:
  build:
    name: Compile WinUI 3 + Inno Setup Installer
    runs-on: windows-2022
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Patch MSBuild extensions from VS2022
        shell: pwsh
        run: |
          $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $sdkVersion = dotnet --version
          $srcBase = "$vsPath\MSBuild\Microsoft\VisualStudio\v17.0"
          $sdkBase = "C:\Program Files\dotnet\sdk\$sdkVersion\Microsoft\VisualStudio\v17.0"
          New-Item -ItemType Directory -Path $sdkBase -Force | Out-Null
          if (Test-Path "$srcBase\AppxPackage") {
            Copy-Item "$srcBase\AppxPackage" -Destination "$sdkBase\AppxPackage" -Recurse -Force
          }

      - name: Restore
        shell: pwsh
        run: dotnet restore apps/desktop/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Build Release
        shell: pwsh
        run: dotnet build apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 -p:Platform=x64 -p:EnableMsixTooling=false

      - name: Publish
        shell: pwsh
        run: dotnet publish apps/desktop/LizCoderPlus.Desktop.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -p:PublishSingleFile=false -p:EnableMsixTooling=false -p:AppxPackage=false -o publish-output

      - name: Find launcher EXE
        shell: pwsh
        run: |
          # List top files
          Get-ChildItem publish-output -File | Sort-Object Length -Descending | Select-Object -First 15 Name, @{N='MB';E={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize

          # Find the app entry point (could be .exe or we check for apphost)
          $exe = Get-ChildItem publish-output -Filter "LizCoderPlus.Desktop.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($exe) {
            Write-Host "LAUNCHER: LizCoderPlus.Desktop.exe"
            Set-Content "launcher.txt" "LizCoderPlus.Desktop.exe"
          } else {
            # WinUI3 might publish with apphost - find the main exe
            $dll = Get-ChildItem publish-output -Filter "LizCoderPlus.Desktop.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($dll) {
              Write-Host "LAUNCHER: LizCoderPlus.Desktop.dll (WinUI3 apphost mode)"
              Set-Content "launcher.txt" "LizCoderPlus.Desktop.dll"
            } else {
              Write-Host "ERROR: No launcher found"
              exit 1
            }
          }

      - name: Build Installer with Inno Setup
        shell: pwsh
        run: |
          $innoPath = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $innoPath)) {
            choco install innosetup -y --no-progress
          }

          # Read the launcher name
          $launcher = Get-Content "launcher.txt".Trim()
          Write-Host "Building installer for: $launcher"

          # Read ISS template and replace the exe name
          $iss = Get-Content "apps\desktop\installer-ci.iss" -Raw
          $iss = $iss -replace 'LizCoderPlus\.Desktop\.exe', $launcher
          Set-Content "installer-build.iss" -Value $iss

          # Compile
          & $innoPath installer-build.iss
          if ($LASTEXITCODE -ne 0) {
            Write-Host "ERROR: Inno Setup failed"
            exit 1
          }

          $setupExe = Get-Item "installer-output\LizCoderPlus-Setup-*.exe" | Select-Object -First 1
          if ($setupExe) {
            Copy-Item $setupExe.FullName "LizCoderPlus-Setup.exe" -Force
            $mb = [math]::Round($setupExe.Length / 1MB, 2)
            Write-Host "SUCCESS: LizCoderPlus-Setup.exe ($mb MB)"
          } else {
            Write-Host "ERROR: Setup not found"
            exit 1
          }

      - name: Upload Installer
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-Installer
          path: LizCoderPlus-Setup.exe
          retention-days: 30

      - name: Create GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.version || 'v0.18.0' }}"
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) { gh release delete $tag --yes }
          gh release create $tag LizCoderPlus-Setup.exe --title "Liz Coder Plus $tag" --notes "Instalador profesional (.exe). Descarga y ejecuta LizCoderPlus-Setup.exe para instalar." --prerelease

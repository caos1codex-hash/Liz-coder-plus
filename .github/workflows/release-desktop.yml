# ============================================================
# GitHub Actions: Build & Release WinUI 3 Desktop .exe
# Triggers on version tag push (v*.*.*)
# ============================================================

name: Build Desktop Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g. 0.14.0)'
        required: true
        default: '0.14.0'

env:
  DOTNET_VERSION: '8.0.423'
  PROJECT_DIR: apps/desktop
  CONFIGURATION: Release

jobs:
  build-windows:
    name: Build Windows Desktop .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pin .NET 8 SDK
        shell: pwsh
        run: |
          '{"sdk":{"version":"8.0.423","rollForward":"latestFeature"}}' | Out-File -FilePath global.json -Encoding utf8
          dotnet --version

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install Windows Desktop workload
        shell: pwsh
        run: |
          dotnet workload install windows-desktop
          dotnet workload list

      - name: Restore
        shell: pwsh
        run: dotnet restore ${{ env.PROJECT_DIR }}/LizCoderPlus.Desktop.csproj -r win-x64 -p:Platform=x64

      - name: Publish win-x64
        shell: pwsh
        run: |
          dotnet publish ${{ env.PROJECT_DIR }}/LizCoderPlus.Desktop.csproj `
            -c ${{ env.CONFIGURATION }} `
            -r win-x64 `
            --self-contained true `
            -p:Platform=x64 `
            -p:PublishSingleFile=false `
            -p:AppxPackage=false

      - name: Verify .exe and create ZIP
        shell: pwsh
        run: |
          $publishDir = "${{ env.PROJECT_DIR }}\bin\x64\Release\net8.0-windows10.0.19041.0\win-x64\publish"
          $exe = Get-ChildItem -Path $publishDir -Filter "LizCoderPlus*.exe" | Select-Object -First 1
          if ($exe) {
            $size = [math]::Round($exe.Length / 1MB, 2)
            echo "FOUND: $($exe.Name) ($size MB)"
            Compress-Archive -Path $publishDir\* -DestinationPath LizCoderPlus-${{ github.event.inputs.version || '0.14.0' }}-win-x64.zip -Force
            echo "ZIP created!"
          } else {
            echo "ERROR: .exe not found in $publishDir"
            Get-ChildItem -Path $publishDir -ErrorAction SilentlyContinue | Select-Object Name, Length
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: "*.zip"
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: LizCoderPlus-win-x64
          path: dist/

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ github.event.inputs.version || '0.14.0' }}"
          TAG="v${VERSION}"

          gh release create "$TAG" \
            dist/*.zip \
            --repo ${{ github.repository }} \
            --title "Liz Coder Plus v${VERSION}" \
            --notes "## Liz Coder Plus v${VERSION}

          ### Descarga
          - **Windows x64**: ZIP incluido

          ### Instalacion
          1. Descarga el ZIP
          2. Extrae el contenido
          3. Ejecuta LizCoderPlus.Desktop.exe" \
            || echo "Release may already exist, skipping"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check packages/ apps/backend/src/

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install mypy
      - run: mypy packages/core/src packages/llm/src packages/memory/src --ignore-missing-imports

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r apps/backend/requirements.txt
          pip install pytest pytest-asyncio
          pip install -e packages/core
          pip install -e packages/memory
          pip install -e packages/llm
          pip install -e packages/tools
          pip install -e packages/agents
          pip install -e packages/multiagent
          pip install -e packages/shared
      - name: Run tests
        run: pytest tests/ -v --tb=short --timeout=60
        timeout-minutes: 10

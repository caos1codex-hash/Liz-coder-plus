name: Build Linux Desktop App

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.19.0)'
        required: false
        default: 'v0.19.0'
  push:
    branches: [main]
    paths:
      - 'apps/linux-desktop/**'

jobs:
  build:
    name: Build Linux Qt App
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 python3-pip python3-venv \
            libegl1 libgles2 libgl1-mesa-glx \
            libdbus-1-3 libxcb-cursor0 \
            xvfb

      - name: Install Python deps
        run: |
          cd apps/linux-desktop
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install PySide6 websocket-client pyinstaller

      - name: Test imports
        run: |
          cd apps/linux-desktop
          source venv/bin/activate
          QT_QPA_PLATFORM=offscreen python3 -c "
          from main import ChatService, ChatWindow, __version__
          print(f'Version: {__version__}')
          print('ChatService OK')
          print('ALL TESTS PASSED')
          "

      - name: Build AppImage with PyInstaller
        run: |
          cd apps/linux-desktop
          source venv/bin/activate

          pyinstaller --noconfirm --onedir \
            --name "LizCoderPlus" \
            --windowed \
            --hidden-import websocket \
            --hidden-import websocket._abnf \
            --hidden-import websocket._app \
            --hidden-import websocket._core \
            --hidden-import websocket._exceptions \
            --hidden-import websocket._http \
            --hidden-import websocket._logging \
            --hidden-import websocket._socket \
            --hidden-import websocket._ssl_compat \
            --hidden-import websocket._url \
            --hidden-import websocket._utils \
            --collect-all PySide6 \
            main.py

          echo "=== Build output ==="
          ls -la dist/LizCoderPlus/ | head -20
          echo "=== Total size ==="
          du -sh dist/LizCoderPlus/

      - name: Create tar.gz archive
        run: |
          cd apps/linux-desktop
          tar -czf LizCoderPlus-linux.tar.gz -C dist LizCoderPlus
          ls -lh LizCoderPlus-linux.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LizCoderPlus-Linux
          path: apps/linux-desktop/LizCoderPlus-linux.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        if: success() && github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.version || 'v0.19.0' }}"
          gh release view "$TAG" 2>/dev/null && gh release delete "$TAG" --yes || true
          gh release create "$TAG" \
            apps/linux-desktop/LizCoderPlus-linux.tar.gz \
            --title "Liz Coder Plus $TAG (Linux)" \
            --notes "App nativa de Linux (Qt6/PySide6).

          Instrucciones:
          1. Descargar LizCoderPlus-linux.tar.gz
          2. tar -xzf LizCoderPlus-linux.tar.gz
          3. cd LizCoderPlus
          4. ./LizCoderPlus" \
            --prerelease

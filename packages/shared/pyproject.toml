[project]
name = "liz-shared"
version = "0.1.2"
description = "Shared models, types, and utilities for Liz Coder Plus"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liz-multiagent"
version = "0.1.0"
description = "Multi-agent orchestrator package for Liz Coder Plus (Sprint 2.1)"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
